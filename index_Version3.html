<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Pong - Professional Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00ffcc;
      --secondary: #ff00ff;
      --bg-color: #0a0a0a;
      --text-glow: 0 0 10px rgba(0, 255, 204, 0.8), 0 0 20px rgba(0, 255, 204, 0.5);
    }
    body {
      background: var(--bg-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Orbitron', sans-serif;
      color: #fff;
      overflow: hidden;
    }
    #game-container {
      position: relative;
    }
    #score-board {
      display: flex;
      justify-content: space-between;
      width: 400px;
      margin-bottom: 20px;
      font-size: 32px;
      font-weight: bold;
      text-shadow: var(--text-glow);
    }
    .score-label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #aaa;
      text-shadow: none;
      display: block;
      margin-bottom: 5px;
    }
    .player-score-container, .ai-score-container {
      text-align: center;
    }
    .player-score-container {
      color: var(--primary);
    }
    .ai-score-container {
      color: var(--secondary);
      text-shadow: 0 0 10px rgba(255, 0, 255, 0.8), 0 0 20px rgba(255, 0, 255, 0.5);
    }
    #gameCanvas {
      background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
      display: block;
      margin: 0 auto;
      border: 2px solid #333;
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.1), inset 0 0 20px rgba(0,0,0,0.8);
      touch-action: none;
    }
    #controls {
      margin-top: 25px;
      display: flex;
      gap: 20px;
    }
    button {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      padding: 12px 30px;
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.3), inset 0 0 10px rgba(0, 255, 204, 0.1);
      outline: none;
    }
    button:hover {
      background: var(--primary);
      color: #000;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.8), inset 0 0 10px rgba(0, 255, 204, 0.5);
    }
    #stop-btn {
      color: #ff3366;
      border-color: #ff3366;
      box-shadow: 0 0 10px rgba(255, 51, 102, 0.3), inset 0 0 10px rgba(255, 51, 102, 0.1);
    }
    #stop-btn:hover {
      background: #ff3366;
      color: #000;
      box-shadow: 0 0 20px rgba(255, 51, 102, 0.8), inset 0 0 10px rgba(255, 51, 102, 0.5);
    }
    
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 400px;
      height: 600px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      z-index: 10;
    }
    
    #overlay h2 {
      font-size: 48px;
      color: var(--primary);
      text-shadow: var(--text-glow);
      margin-bottom: 30px;
      text-align: center;
    }
    
    .hidden {
      display: none !important;
    }

    /* Scanlines effect */
    #game-container::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2;
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div id="score-board">
    <div class="player-score-container">
      <span class="score-label">Player</span>
      <span id="player-score">0</span>
    </div>
    <div class="ai-score-container">
      <span class="score-label">CPU</span>
      <span id="ai-score">0</span>
    </div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <div id="overlay">
      <h2 id="overlay-msg">NEON PONG</h2>
      <button id="start-overlay-btn">START GAME</button>
    </div>
  </div>

  <div id="controls">
    <button id="start-btn">Start / Resume</button>
    <button id="stop-btn">Pause</button>
  </div>

  <script>
    // ------ Sound generators ------
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let ctxAudio;

    function initAudio() {
      if (!ctxAudio) {
        ctxAudio = new AudioContext();
      }
      if (ctxAudio.state === 'suspended') {
        ctxAudio.resume();
      }
    }

    function playSound(type) {
      if (!ctxAudio) return;
      const o = ctxAudio.createOscillator();
      const g = ctxAudio.createGain();
      
      if (type === 'paddle') {
        o.type = 'square';
        o.frequency.value = 300 + Math.random() * 50;
        g.gain.value = 0.1;
        o.connect(g); g.connect(ctxAudio.destination);
        o.start();
        o.frequency.exponentialRampToValueAtTime(600, ctxAudio.currentTime + 0.05);
        g.gain.exponentialRampToValueAtTime(0.01, ctxAudio.currentTime + 0.1);
        o.stop(ctxAudio.currentTime + 0.1);
      } 
      else if (type === 'wall') {
        o.type = 'sine';
        o.frequency.value = 220;
        g.gain.value = 0.1;
        o.connect(g); g.connect(ctxAudio.destination);
        o.start();
        g.gain.exponentialRampToValueAtTime(0.01, ctxAudio.currentTime + 0.1);
        o.stop(ctxAudio.currentTime + 0.1);
      }
      else if (type === 'score_player') {
        o.type = 'sawtooth';
        o.frequency.value = 400;
        g.gain.value = 0.15;
        o.connect(g); g.connect(ctxAudio.destination);
        o.start();
        o.frequency.linearRampToValueAtTime(800, ctxAudio.currentTime + 0.1);
        o.frequency.linearRampToValueAtTime(1200, ctxAudio.currentTime + 0.2);
        g.gain.linearRampToValueAtTime(0, ctxAudio.currentTime + 0.3);
        o.stop(ctxAudio.currentTime + 0.3);
      }
      else if (type === 'score_ai') {
        o.type = 'sawtooth';
        o.frequency.value = 300;
        g.gain.value = 0.15;
        o.connect(g); g.connect(ctxAudio.destination);
        o.start();
        o.frequency.linearRampToValueAtTime(150, ctxAudio.currentTime + 0.2);
        g.gain.linearRampToValueAtTime(0, ctxAudio.currentTime + 0.3);
        o.stop(ctxAudio.currentTime + 0.3);
      }
      else if (type === 'start') {
        o.type = 'square';
        o.frequency.value = 220;
        g.gain.value = 0.1;
        o.connect(g); g.connect(ctxAudio.destination);
        o.start();
        o.frequency.setValueAtTime(440, ctxAudio.currentTime + 0.1);
        o.frequency.setValueAtTime(880, ctxAudio.currentTime + 0.2);
        g.gain.linearRampToValueAtTime(0, ctxAudio.currentTime + 0.4);
        o.stop(ctxAudio.currentTime + 0.4);
      }
    }

    // ------ Canvas and objects ------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const playerScoreEl = document.getElementById('player-score');
    const aiScoreEl = document.getElementById('ai-score');
    
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    const startOverlayBtn = document.getElementById('start-overlay-btn');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');

    const CANVAS_W = canvas.width;
    const CANVAS_H = canvas.height;

    const PADDLE_WIDTH = 90, PADDLE_HEIGHT = 12;
    // Bottom paddle (Player)
    let playerX = (CANVAS_W - PADDLE_WIDTH) / 2;
    const PADDLE_Y = CANVAS_H - 30; // Bottom offset
    let leftPressed = false, rightPressed = false;
    const PADDLE_SPEED = 8;

    // Top paddle (AI)
    let aiX = (CANVAS_W - PADDLE_WIDTH) / 2;
    const AI_PADDLE_Y = 18;

    // Ball
    const BALL_RADIUS = 8;
    let ballX = CANVAS_W / 2, ballY = CANVAS_H / 2;
    let ballVX = 0, ballVY = 0;
    
    let playerScore = 0, aiScore = 0;
    
    // Game State
    let isRunning = false;
    let animationFrameId;

    // --- Drawing ---
    function draw() {
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

      // Middle dashed line
      ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
      ctx.lineWidth = 2;
      ctx.setLineDash([15, 15]);
      ctx.beginPath();
      ctx.moveTo(0, CANVAS_H / 2);
      ctx.lineTo(CANVAS_W, CANVAS_H / 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // Ball with glow
      ctx.shadowBlur = 15;
      ctx.shadowColor = "#fff";
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(ballX, ballY, BALL_RADIUS, 0, 2 * Math.PI);
      ctx.fill();

      // Player paddle (bottom) - Cyan glow
      ctx.shadowBlur = 20;
      ctx.shadowColor = "#00ffcc";
      ctx.fillStyle = "#00ffcc";
      
      // Rounded rectangle for paddle
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(playerX, PADDLE_Y, PADDLE_WIDTH, PADDLE_HEIGHT, 6);
        ctx.fill();
      } else {
        ctx.fillRect(playerX, PADDLE_Y, PADDLE_WIDTH, PADDLE_HEIGHT);
      }

      // AI paddle (top) - Magenta glow
      ctx.shadowBlur = 20;
      ctx.shadowColor = "#ff00ff";
      ctx.fillStyle = "#ff00ff";
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(aiX, AI_PADDLE_Y, PADDLE_WIDTH, PADDLE_HEIGHT, 6);
        ctx.fill();
      } else {
        ctx.fillRect(aiX, AI_PADDLE_Y, PADDLE_WIDTH, PADDLE_HEIGHT);
      }
      
      // Reset shadow
      ctx.shadowBlur = 0;
    }

    // --- Game logic ---
    function update() {
      if (!isRunning) return;

      // Player movement
      if (leftPressed) playerX -= PADDLE_SPEED;
      if (rightPressed) playerX += PADDLE_SPEED;
      playerX = Math.max(0, Math.min(CANVAS_W - PADDLE_WIDTH, playerX));

      // AI paddle (simple follow with some delay/imperfection)
      let aiCenter = aiX + PADDLE_WIDTH / 2;
      let aiSpeed = PADDLE_SPEED * 0.6; // AI speed
      if (aiCenter < ballX - 10) aiX += aiSpeed;
      else if (aiCenter > ballX + 10) aiX -= aiSpeed;
      aiX = Math.max(0, Math.min(CANVAS_W - PADDLE_WIDTH, aiX));

      // Ball movement
      ballX += ballVX;
      ballY += ballVY;

      // Wall bounces (left/right)
      if (ballX - BALL_RADIUS < 0) {
        ballX = BALL_RADIUS;
        ballVX *= -1;
        playSound('wall');
      }
      if (ballX + BALL_RADIUS > CANVAS_W) {
        ballX = CANVAS_W - BALL_RADIUS;
        ballVX *= -1;
        playSound('wall');
      }

      // Player paddle collision (bottom)
      if (
        ballY + BALL_RADIUS > PADDLE_Y &&
        ballY - BALL_RADIUS < PADDLE_Y + PADDLE_HEIGHT &&
        ballX > playerX &&
        ballX < playerX + PADDLE_WIDTH &&
        ballVY > 0
      ) {
        ballY = PADDLE_Y - BALL_RADIUS;
        ballVY *= -1.05; // Slightly increase speed
        // Add spin based on paddle contact
        let hitRatio = (ballX - (playerX + PADDLE_WIDTH / 2)) / (PADDLE_WIDTH / 2);
        ballVX = hitRatio * 6; // Max horizontal speed from spin
        
        // Cap max vertical speed
        if(ballVY < -12) ballVY = -12;
        
        playSound('paddle');
      }

      // AI paddle collision (top)
      if (
        ballY - BALL_RADIUS < AI_PADDLE_Y + PADDLE_HEIGHT &&
        ballY + BALL_RADIUS > AI_PADDLE_Y &&
        ballX > aiX &&
        ballX < aiX + PADDLE_WIDTH &&
        ballVY < 0
      ) {
        ballY = AI_PADDLE_Y + PADDLE_HEIGHT + BALL_RADIUS;
        ballVY *= -1.05;
        let hitRatio = (ballX - (aiX + PADDLE_WIDTH / 2)) / (PADDLE_WIDTH / 2);
        ballVX = hitRatio * 6;
        
        if(ballVY > 12) ballVY = 12;
        
        playSound('paddle');
      }

      // --- Scoring ---
      if (ballY < 0) {
        playerScore++;
        playerScoreEl.textContent = playerScore;
        playSound('score_player');
        checkWinCondition();
        if(isRunning) resetBall(-1);
      }
      else if (ballY > CANVAS_H) {
        aiScore++;
        aiScoreEl.textContent = aiScore;
        playSound('score_ai');
        checkWinCondition();
        if(isRunning) resetBall(1);
      }
    }
    
    function checkWinCondition() {
      if (playerScore >= 10) {
        endGame("YOU WIN!");
      } else if (aiScore >= 10) {
        endGame("CPU WINS!");
      }
    }
    
    function endGame(msg) {
      isRunning = false;
      overlayMsg.textContent = msg;
      startOverlayBtn.textContent = "PLAY AGAIN";
      overlay.classList.remove('hidden');
    }

    function resetBall(startDirTop) {
      ballX = CANVAS_W / 2;
      ballY = CANVAS_H / 2;
      ballVX = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 2);
      ballVY = startDirTop < 0 ? -5 : 5;
    }

    // --- Controls ---
    function startGame() {
      initAudio();
      if (playerScore >= 10 || aiScore >= 10) {
        // Reset scores if game was over
        playerScore = 0;
        aiScore = 0;
        playerScoreEl.textContent = "0";
        aiScoreEl.textContent = "0";
      }
      
      if (ballVX === 0 && ballVY === 0) {
        resetBall(1);
      }
      
      isRunning = true;
      overlay.classList.add('hidden');
      playSound('start');
    }

    function stopGame() {
      isRunning = false;
      overlayMsg.textContent = "PAUSED";
      startOverlayBtn.textContent = "RESUME";
      overlay.classList.remove('hidden');
    }

    startBtn.addEventListener('click', startGame);
    startOverlayBtn.addEventListener('click', startGame);
    stopBtn.addEventListener('click', stopGame);

    // Mouse
    canvas.addEventListener('mousemove', function(e) {
      if(!isRunning) return;
      const rect = canvas.getBoundingClientRect();
      let mx = e.clientX - rect.left;
      playerX = mx - PADDLE_WIDTH / 2;
      playerX = Math.max(0, Math.min(CANVAS_W - PADDLE_WIDTH, playerX));
    });

    // Touch
    canvas.addEventListener('touchmove', function(e) {
      if(!isRunning) return;
      if(e.touches.length) {
        const rect = canvas.getBoundingClientRect();
        let mx = e.touches[0].clientX - rect.left;
        playerX = mx - PADDLE_WIDTH / 2;
        playerX = Math.max(0, Math.min(CANVAS_W - PADDLE_WIDTH, playerX));
        e.preventDefault(); // Prevent scrolling on mobile while playing
      }
    }, {passive:false});

    // Keyboard
    window.addEventListener('keydown', function(e) {
      if (e.key === "ArrowLeft") leftPressed = true;
      if (e.key === "ArrowRight") rightPressed = true;
      if (e.key === "Escape" || e.key === "p" || e.key === "P") {
        if(isRunning) stopGame();
        else startGame();
      }
    });
    window.addEventListener('keyup', function(e) {
      if (e.key === "ArrowLeft") leftPressed = false;
      if (e.key === "ArrowRight") rightPressed = false;
    });

    // --- Main loop ---
    function gameLoop() {
      update();
      draw();
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    // Initial draw
    draw();
    gameLoop();
  </script>
</body>
</html>
